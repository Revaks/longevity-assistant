# Сборка Windows-исполняемого файла десктопа (PyInstaller, windows-latest).
# Запускается по тегу v* (релиз) и вручную (workflow_dispatch).
name: Windows build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller .

      - name: Run unit tests (headless)
        run: |
          pip install pytest
          python -m pytest -q

      - name: Build executable
        run: pyinstaller --noconfirm --clean desktop.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: longevity-assistant-windows
          path: dist/longevity-assistant.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          gh release upload "${{ github.ref_name }}" dist/longevity-assistant.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

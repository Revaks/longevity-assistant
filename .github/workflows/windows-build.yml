# Сборка Windows-исполняемого файла десктопа (PyInstaller, windows-latest).
# Запускается по тегу v* (релиз) и вручную (workflow_dispatch).
name: Windows build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller .

      - name: Run core unit tests (headless, без Tk)
        # На Windows GUI-тесты на Tk и фоновых потоках нестабильны (крах
        # test_widgets), поэтому здесь прогоняем только ядро — оно про Tk
        # не знает. Полный набор гоняется на Linux.
        run: |
          pip install pytest
          python -m pytest -q tests/test_content.py tests/test_schedule.py tests/test_storage.py tests/test_search.py tests/test_text.py tests/test_vectors.py tests/test_paths.py tests/test_data_files.py tests/test_books_content.py tests/test_book_search.py tests/test_plan.py tests/test_habits.py tests/test_screenings.py tests/test_measures.py tests/test_extras.py tests/test_settings.py tests/test_readme.py

      - name: Build executable
        run: pyinstaller --noconfirm --clean desktop.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: longevity-assistant-windows
          path: dist/longevity-assistant.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          gh release upload "${{ github.ref_name }}" dist/longevity-assistant.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
